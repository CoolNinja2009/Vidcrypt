plugins { id 'application' }
application {
    mainClass = 'com.vidcrypt.cli.VidcryptMain'
}
dependencies {
    implementation project(':vidcrypt-core')
    implementation project(':vidcrypt-encoder')
    implementation project(':vidcrypt-decoder')
    implementation 'info.picocli:picocli:4.7.5'
    annotationProcessor 'info.picocli:picocli-codegen:4.7.5'
}
